services:
  rfobserver:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: on-failure
    # Ordered stop can take up to about 20s: 5s for the web server plus up to
    # 15s for the pipeline stop, including the recording finalize. Docker's
    # default of 10s would SIGKILL it partway.
    stop_grace_period: 30s
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      RFOBS_MOCK_RECEIVER: "true"
      RFOBS_STORAGE_PATH: /data
      RFOBS_DB_PATH: /data/rfobserver.db
      RFOBS_LOG_LEVEL: DEBUG
    volumes:
      - rfobs-data:/data

volumes:
  rfobs-data:
