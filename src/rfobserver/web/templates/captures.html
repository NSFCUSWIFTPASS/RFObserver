{% extends "base.html" %}
{% block title %}Captures - RFObserver{% endblock %}
{% block content %}
<script src="/static/shared-charts.js"></script>
<div class="page-header">
    <h1>IQ Captures</h1>
</div>

<div class="captures-layout">
    <div class="captures-list" id="captures-list">
        <div class="placeholder-text">Loading...</div>
    </div>
    <div class="captures-detail" id="captures-detail">
        <div class="placeholder-text">Select a capture to view details</div>
    </div>
</div>

<div id="captures-viewer-container" class="card" style="margin-top: 16px; display: none;">
    <div class="card-body" id="captures-viewer">
    </div>
</div>

<div class="card" style="margin-top: 16px;">
    <div class="card-header">Replay a Raw File</div>
    <div class="card-body">
        <div class="config-form">
            <div class="form-row" style="grid-template-columns: 1fr;">
                <div class="form-group">
                    <label for="replay-path">File Path</label>
                    <input type="text" id="replay-path" placeholder="/path/to/capture.dat">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="replay-center-mhz">Center Freq (MHz)</label>
                    <input type="number" id="replay-center-mhz" step="0.001">
                </div>
                <div class="form-group">
                    <label for="replay-rate-msps">Sample Rate (Msps)</label>
                    <input type="number" id="replay-rate-msps" step="0.001">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="replay-gain-db">Gain (dB)</label>
                    <input type="number" id="replay-gain-db" step="0.1">
                </div>
                <div class="form-group">
                    <label for="replay-datatype">Datatype</label>
                    <select id="replay-datatype">
                        <option value="ci16_le" selected>ci16_le</option>
                        <option value="cf32_le">cf32_le</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="replay-speed">Speed</label>
                    <select id="replay-speed">
                        <option value="0.25">0.25x</option>
                        <option value="1" selected>1x</option>
                        <option value="2">2x</option>
                        <option value="4">4x</option>
                    </select>
                </div>
                <div class="form-group" style="justify-content: flex-end;">
                    <label>&nbsp;</label>
                    <button type="button" id="replay-raw-start-btn" class="btn-apply" style="width: 100%;">Start replay</button>
                </div>
            </div>
            <span id="replay-raw-error" class="replay-error"></span>
        </div>
    </div>
</div>

<script>
(function() {
    const listEl = document.getElementById("captures-list");
    const detailEl = document.getElementById("captures-detail");
    const viewerContainer = document.getElementById("captures-viewer-container");
    const viewerEl = document.getElementById("captures-viewer");

    function formatBytes(b) {
        if (b < 1024) return b + " B";
        if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
        if (b < 1073741824) return (b / 1048576).toFixed(1) + " MB";
        return (b / 1073741824).toFixed(2) + " GB";
    }

    function formatDuration(sec) {
        if (sec < 1) return (sec * 1000).toFixed(0) + " ms";
        if (sec < 60) return sec.toFixed(1) + " s";
        return (sec / 60).toFixed(1) + " min";
    }

    function formatFreq(hz) {
        if (hz >= 1e9) return (hz / 1e9).toFixed(3) + " GHz";
        if (hz >= 1e6) return (hz / 1e6).toFixed(1) + " MHz";
        if (hz >= 1e3) return (hz / 1e3).toFixed(1) + " kHz";
        return hz + " Hz";
    }

    async function loadList() {
        try {
            const r = await fetch("/captures/list");
            if (!r.ok) return;
            const captures = await r.json();

            if (captures.length === 0) {
                listEl.innerHTML = '<div class="placeholder-text">No captures yet</div>';
                return;
            }

            let html = "";
            for (const c of captures) {
                const m = c.meta || {};
                const freq = m.center_freq_hz ? formatFreq(m.center_freq_hz) : "";
                const dur = m.duration_sec ? formatDuration(m.duration_sec) : "";
                const dropped = m.dropped_chunks || 0;
                const time = m.start_time ? new Date(m.start_time).toLocaleString() : "";
                const psdBadge = c.has_psd ? '<span class="psd-badge">PSD</span>' : '';

                html += '<div class="capture-item" data-file="' + c.filename + '"'
                    + ' data-has-psd="' + (c.has_psd ? '1' : '0') + '">';
                html += '<div class="capture-name">' + c.filename + ' ' + psdBadge + '</div>';
                html += '<div class="capture-info">';
                html += formatBytes(c.size_bytes);
                if (dur) html += ' &middot; ' + dur;
                if (freq) html += ' &middot; ' + freq;
                if (dropped > 0) html += ' &middot; <span style="color:#ff3b30;">' + dropped + ' dropped</span>';
                html += '</div>';
                if (time) html += '<div class="capture-time">' + time + '</div>';
                html += '</div>';
            }
            listEl.innerHTML = html;

        } catch (_) {
            listEl.innerHTML = '<div class="placeholder-text">Failed to load</div>';
        }
    }

    // --- Viewer state ---
    // The waterfall is virtualized: rows are fetched in pages on demand as the
    // user scrolls, cached (with a bounded LRU so very long captures don't
    // exhaust memory), and only the visible window is ever drawn. The slider is
    // scoped to whatever rows are currently on screen.
    let viewerFreqs = null;    // freq axis
    let viewerTimeRes = 0;     // seconds per row
    let viewerTotalRows = 0;
    let viewerMin = -120;
    let viewerMax = -40;
    let viewerCrosshairBin = -1;
    let viewerFilename = null;
    // Display calibration baked into the capture: shifts stored dBFS/Hz to the
    // dBm/Hz the live view showed when recording. 0 / "dBFS" when uncalibrated.
    let viewerOffset = 0;
    let viewerUnit = "dBFS";
    // Per-capture detections loaded from the independent sidecar
    // (GET /captures/detections/<file>). Reset on every capture switch.
    let viewerDetections = [];
    let viewerDetPending = false;
    let selectedDetection = null;

    const VIEW_ROWS = 400;     // waterfall viewport height in rows (1px/row)
    const PAGE = 500;          // rows fetched per request
    const MAX_PAGES = 48;      // LRU cap (~24k rows cached)
    let pageCache = new Map(); // pageIdx -> rows[][] (Map order = LRU)
    let pageLoading = new Set();
    let psdWs = null;          // binary PSD stream for the open capture (null = HTTP only)

    // Tear down the binary PSD socket (viewer close / capture switch). Null the
    // handlers first so a superseded socket's onclose can't touch fresh state.
    function closePsdWs() {
        if (psdWs) {
            try {
                psdWs.onmessage = null;
                psdWs.onclose = null;
                psdWs.onerror = null;
                psdWs.close();
            } catch (_) {}
            psdWs = null;
        }
    }

    async function showDetail(filename, hasPsd) {
        document.querySelectorAll(".capture-item").forEach(function(el) {
            el.classList.toggle("selected", el.dataset.file === filename);
        });

        try {
            const r = await fetch("/captures/detail/" + encodeURIComponent(filename));
            if (!r.ok) return;
            const d = await r.json();

            const m = d.meta || {};
            let html = '<div class="detail-header">' + d.filename + '</div>';
            html += '<table class="detail-table">';
            html += row("Size", formatBytes(d.size_bytes));
            if (m.format) html += row("Format", m.format.toUpperCase());
            if (m.sample_rate_hz) html += row("Sample Rate", formatFreq(m.sample_rate_hz));
            if (m.center_freq_hz) html += row("Center Freq", formatFreq(m.center_freq_hz));
            if (m.bandwidth_hz) html += row("Bandwidth", formatFreq(m.bandwidth_hz));
            if (m.gain_db != null) html += row("Gain", m.gain_db + " dB");
            if (m.duration_sec != null) html += row("Duration", formatDuration(m.duration_sec));
            if (m.total_samples != null) html += row("Samples", m.total_samples.toLocaleString());
            if (m.start_time) html += row("Start Time", new Date(m.start_time).toLocaleString());
            html += row("Trigger", m.trigger_initiated ? "Power threshold" : "Manual");
            html += row("Mode", m.ram_buffered ? "RAM buffered" : "Disk streaming");
            if (m.pre_trigger_sec != null) html += row("Pre-trigger", m.pre_trigger_sec + " s");
            if (m.dropped_chunks != null) {
                const cls = m.dropped_chunks > 0 ? ' style="color:#ff3b30;font-weight:600;"' : '';
                html += '<tr><td class="detail-label">Dropped Chunks</td>'
                    + '<td class="detail-value"' + cls + '>' + m.dropped_chunks + '</td></tr>';
            }
            if (m.hostname) html += row("Hostname", m.hostname);
            if (m.serial) html += row("Serial", m.serial);
            html += '</table>';
            html += '<div class="detail-actions">';
            html += '<button type="button" id="replay-capture-btn" class="btn-apply" data-filename="'
                + d.filename + '">Replay this capture</button>';
            html += '<span id="replay-capture-error" class="replay-error"></span>';
            html += '</div>';

            detailEl.innerHTML = html;

            // Show viewer below in full-width container
            if (hasPsd) {
                viewerContainer.style.display = "";
                viewerEl.innerHTML = '<div class="viewer-label">Loading PSD data...</div>';
                loadPsdViewer(filename, m.duration_sec);
            } else {
                closePsdWs();
                viewerDetections = [];
                viewerDetPending = false;
                selectedDetection = null;
                viewerContainer.style.display = "none";
                viewerEl.innerHTML = "";
            }

        } catch (_) {
            detailEl.innerHTML = '<div class="placeholder-text">Failed to load details</div>';
        }
    }

    // Shift a page's stored dBFS/Hz values to the calibrated dBm/Hz the live
    // view used. Applied once per page on load; no-op when uncalibrated.
    function shiftRows(rows) {
        if (!viewerOffset) return;
        for (let i = 0; i < rows.length; i++) {
            const r = rows[i];
            for (let j = 0; j < r.length; j++) r[j] += viewerOffset;
        }
    }

    async function fetchPageRaw(start) {
        try {
            const r = await fetch("/captures/psd/" + encodeURIComponent(viewerFilename)
                + "?start=" + start + "&count=" + PAGE + "&max_bins=512");
            if (!r.ok) return null;
            return await r.json();
        } catch (_) {
            return null;
        }
    }

    async function loadPsdViewer(filename, durationSec) {
        viewerFilename = filename;
        closePsdWs();
        pageCache = new Map();
        pageLoading = new Set();
        viewerCrosshairBin = -1;
        viewerDetections = [];
        viewerDetPending = false;
        selectedDetection = null;

        try {
            // The first page doubles as the metadata probe (total rows, time
            // resolution, freq axis, global colour range).
            const first = await fetchPageRaw(0);
            if (!first) { viewerEl.innerHTML = '<div class="placeholder-text">PSD data unavailable</div>'; return; }

            viewerFreqs = first.freq_axis;
            viewerTotalRows = first.total_rows;
            // Effective time resolution: the PSD grid's nominal
            // time_resolution_s does NOT satisfy total_rows * tres == duration,
            // so labels/table Time (and the sidecar rows) drift out of the grid.
            // Use duration / total_rows so the time axis matches the grid and
            // the sidecar's proportional row placement. Fall back to the nominal
            // PSD tres when duration or rows are unavailable.
            viewerTimeRes = (durationSec && viewerTotalRows > 0)
                ? (durationSec / viewerTotalRows)
                : first.time_resolution_s;
            const calSet = typeof first.cal_offset_db === "number";
            viewerOffset = calSet ? first.cal_offset_db : 0;
            viewerUnit = calSet ? "dBm/Hz" : "dBFS";
            viewerMin = (first.grid_min + viewerOffset) - 3;
            viewerMax = (first.grid_max + viewerOffset) + 3;
            shiftRows(first.grid);
            pageCache.set(0, first.grid);

            const totalRows = viewerTotalRows;
            const viewH = Math.max(1, Math.min(VIEW_ROWS, totalRows));  // viewport rows (1px each)
            const totalDuration = (totalRows * viewerTimeRes).toFixed(3);

            let html = '';
            html += '<div class="viewer-label" id="viewer-wf-label"></div>';
            html += '<div class="viewer-wf-scroll" id="viewer-wf-scroll" style="height:' + viewH + 'px;">';
            html += '<div class="viewer-wf-spacer" style="height:' + totalRows + 'px;">';
            // Both canvases live in a sticky wrapper pinned to the top of the
            // scroll viewport so the overlay tracks the waterfall 1:1.
            html += '<div class="viewer-wf-sticky" style="position:sticky;top:0;width:100%;height:'
                + viewH + 'px;">';
            html += '<canvas id="viewer-wf" class="viewer-wf-canvas" width="920" height="' + viewH
                + '" style="height:' + viewH + 'px;position:absolute;top:0;left:0;"></canvas>';
            html += '<canvas id="viewer-wf-overlay" width="920" height="' + viewH
                + '" style="width:100%;height:' + viewH
                + 'px;position:absolute;top:0;left:0;pointer-events:none;"></canvas>';
            html += '</div></div></div>';
            html += '<div class="viewer-slider-row">';
            html += '<input type="range" id="viewer-slider" min="0" max="' + (viewH - 1)
                + '" value="0" class="viewer-slider">';
            html += '<span id="viewer-time" class="viewer-time">0.000s</span>';
            html += '</div>';
            html += '<div class="viewer-label">PSD at selected time</div>';
            html += '<div style="position:relative;">';
            html += '<canvas id="viewer-psd" width="920" height="160" class="viewer-canvas"></canvas>';
            html += '<div id="viewer-psd-tooltip" class="graph-tooltip" style="display:none;"></div>';
            html += '</div>';
            html += '<div class="spectrogram-legend">';
            html += '<span class="legend-label">' + viewerMin.toFixed(0) + '</span>';
            html += '<canvas id="viewer-legend" width="200" height="12" style="width:200px;height:12px;border-radius:3px;"></canvas>';
            html += '<span class="legend-label">' + viewerMax.toFixed(0) + '</span>';
            html += '<span class="legend-label" style="margin-left:2px;">' + viewerUnit + '</span>';
            html += '</div>';

            // Per-capture detections table (populated client-side from the
            // sidecar). Rebuilt each time a capture is opened.
            html += '<div class="viewer-label" style="margin-top:14px;">Detections</div>';
            html += '<div class="card" style="padding:0;max-height:240px;overflow-y:auto;">';
            html += '<table class="data-table"><thead><tr>'
                + '<th>Time</th><th>Freq</th><th>Bandwidth</th><th>Duration</th><th>Peak</th>'
                + '</tr></thead><tbody id="viewer-det-tbody">'
                + '<tr><td colspan="5" class="placeholder-text">Loading detections...</td></tr>'
                + '</tbody></table></div>';

            // Re-detect: re-run burst detection on this capture's stored PSD
            // grid at custom thresholds, independent of when it was recorded.
            html += '<div class="viewer-label" style="margin-top:14px;">Re-detect</div>';
            html += '<div class="redetect-panel">';
            html += '<div class="form-row">';
            html += '<div class="form-group"><label for="redetect-threshold-high">Threshold High (dB)</label>'
                + '<input type="number" id="redetect-threshold-high" step="0.5" value="40"></div>';
            html += '<div class="form-group"><label for="redetect-threshold-low">Threshold Low Ratio</label>'
                + '<input type="number" id="redetect-threshold-low" step="0.05" min="0" max="1" value="0.6"></div>';
            html += '</div>';
            html += '<div class="form-row">';
            html += '<div class="form-group"><label for="redetect-noise-floor">Noise Floor Percentile</label>'
                + '<input type="number" id="redetect-noise-floor" step="1" min="0" max="100" value="50"></div>';
            html += '<div class="form-group"><label for="redetect-merge-time">Merge Time (ms)</label>'
                + '<input type="number" id="redetect-merge-time" step="1" min="0" value="30"></div>';
            html += '</div>';
            html += '<div class="redetect-actions">';
            html += '<button type="button" id="redetect-btn" class="btn-apply">Re-detect</button>';
            html += '<span id="redetect-error" class="replay-error"></span>';
            html += '</div>';
            html += '</div>';

            viewerEl.innerHTML = html;

            const scrollEl = document.getElementById("viewer-wf-scroll");
            const wfLabel = document.getElementById("viewer-wf-label");
            const wfCanvas = document.getElementById("viewer-wf");
            const wfCtx = wfCanvas.getContext("2d");
            const overlayCanvas = document.getElementById("viewer-wf-overlay");
            const overlayCtx = overlayCanvas.getContext("2d");
            const detTbody = document.getElementById("viewer-det-tbody");
            const redetectThresholdHigh = document.getElementById("redetect-threshold-high");
            const redetectThresholdLow = document.getElementById("redetect-threshold-low");
            const redetectNoiseFloor = document.getElementById("redetect-noise-floor");
            const redetectMergeTime = document.getElementById("redetect-merge-time");
            const redetectBtn = document.getElementById("redetect-btn");
            const redetectError = document.getElementById("redetect-error");
            const psdCanvas = document.getElementById("viewer-psd");
            const psdCtx = psdCanvas.getContext("2d");
            const psdTooltip = document.getElementById("viewer-psd-tooltip");
            const slider = document.getElementById("viewer-slider");
            const timeLabel = document.getElementById("viewer-time");

            // Legend bar
            const legCanvas = document.getElementById("viewer-legend");
            const legCtx = legCanvas.getContext("2d");
            for (let x = 0; x < 200; x++) {
                const [cr, cg, cb] = powerToColor(x, 0, 199);
                legCtx.fillStyle = "rgb(" + cr + "," + cg + "," + cb + ")";
                legCtx.fillRect(x, 0, 1, 12);
            }

            let firstVisibleRow = 0;
            let lastFirstVisibleRow = 0;        // for scroll-direction detection
            let currentNeeded = new Set([0]);   // pages the viewport needs (for LRU + async fills)

            const pageIndexFor = function(absRow) { return Math.floor(absRow / PAGE); };

            function getRow(absRow) {
                const idx = pageIndexFor(absRow);
                const p = pageCache.get(idx);
                return p ? (p[absRow - idx * PAGE] || null) : null;
            }

            // Bound the cache: drop the oldest-loaded pages that aren't part of
            // the current visible window. Scrolling back re-fetches them.
            function evict(neededSet) {
                while (pageCache.size > MAX_PAGES) {
                    let removed = false;
                    for (const key of pageCache.keys()) {
                        if (!neededSet.has(key)) { pageCache.delete(key); removed = true; break; }
                    }
                    if (!removed) break;
                }
            }

            async function ensureVisible(firstRow) {
                const lastRow = Math.min(totalRows - 1, firstRow + viewH - 1);
                const firstPage = pageIndexFor(firstRow);
                const lastPage = pageIndexFor(lastRow);
                const needed = new Set();
                const toFetch = [];
                for (let p = firstPage; p <= lastPage; p++) {
                    needed.add(p);
                    if (!pageCache.has(p) && !pageLoading.has(p)) toFetch.push(p);
                }
                currentNeeded = needed;
                if (toFetch.length === 0) return false;

                // Prefer the binary WS: request each missing page (with a `have`
                // hint so the server skips pages we already cached). The server
                // also pushes the neighbouring pages; all frames arrive async and
                // fill the cache, so the binary handler owns the repaint.
                if (psdWs && psdWs.readyState === WebSocket.OPEN) {
                    const have = Array.from(pageCache.keys()).map(function(idx) { return idx * PAGE; });
                    for (const p of toFetch) {
                        pageLoading.add(p);
                        psdWs.send(JSON.stringify({start: p * PAGE, count: PAGE, max_bins: 512, have: have}));
                    }
                    return false;
                }

                // HTTP fallback (socket not open / errored).
                await Promise.all(toFetch.map(async function(p) {
                    pageLoading.add(p);
                    const resp = await fetchPageRaw(p * PAGE);
                    pageLoading.delete(p);
                    if (resp) { shiftRows(resp.grid); pageCache.set(p, resp.grid); }
                }));
                evict(needed);
                return true;
            }

            // Prefetch pages beyond the currently-visible span in the scroll
            // direction (2 ahead when scrolling forward, 1 behind when
            // scrolling back). Reuses the same WS-request / HTTP-fallback
            // path as ensureVisible and dedups via pageCache/pageLoading.
            function prefetchPages(pages) {
                const lastPage = pageIndexFor(totalRows - 1);
                const toFetch = pages.filter(function(p) {
                    return p >= 0 && p <= lastPage && !pageCache.has(p) && !pageLoading.has(p);
                });
                if (toFetch.length === 0) return;

                if (psdWs && psdWs.readyState === WebSocket.OPEN) {
                    const have = Array.from(pageCache.keys()).map(function(idx) { return idx * PAGE; });
                    for (const p of toFetch) {
                        pageLoading.add(p);
                        psdWs.send(JSON.stringify({start: p * PAGE, count: PAGE, max_bins: 512, have: have}));
                    }
                    return;
                }

                // HTTP fallback (socket not open / errored).
                toFetch.forEach(async function(p) {
                    pageLoading.add(p);
                    const resp = await fetchPageRaw(p * PAGE);
                    pageLoading.delete(p);
                    if (resp) {
                        shiftRows(resp.grid);
                        pageCache.set(p, resp.grid);
                        evict(currentNeeded);
                    }
                });
            }

            function drawHighlight() {
                const y = parseInt(slider.value) - firstVisibleRow;
                if (y >= 0 && y < viewH) {
                    wfCtx.strokeStyle = "rgba(255,255,255,0.6)";
                    wfCtx.lineWidth = 1;
                    wfCtx.beginPath();
                    wfCtx.moveTo(0, y + 0.5);
                    wfCtx.lineTo(920, y + 0.5);
                    wfCtx.stroke();
                }
            }

            function renderWaterfall() {
                const img = wfCtx.createImageData(920, viewH);
                for (let y = 0; y < viewH; y++) {
                    const absRow = firstVisibleRow + y;
                    const rowData = (absRow < totalRows) ? getRow(absRow) : null;
                    if (rowData) {
                        renderWaterfallRow(img, 920, y, rowData, viewerMin, viewerMax);
                    } else {
                        // Not-yet-loaded rows render as a dark placeholder.
                        const base = y * 920 * 4;
                        for (let x = 0; x < 920; x++) {
                            const i = base + x * 4;
                            img.data[i] = 18; img.data[i + 1] = 18; img.data[i + 2] = 30; img.data[i + 3] = 255;
                        }
                    }
                }
                wfCtx.putImageData(img, 0, 0);
                drawHighlight();
                drawDetectionOverlay();
            }

            // Draw the detection boxes on the overlay canvas, aligned 1:1 with
            // the waterfall. Vertical position from absolute rows (offset by the
            // current scroll), horizontal from center +/- bandwidth/2 mapped
            // across the freq axis onto width 920. Mirrors the dashboard's
            // drawBurstOverlay. The selected detection gets a brighter stroke.
            function drawDetectionOverlay() {
                overlayCtx.clearRect(0, 0, 920, viewH);
                if (!viewerDetections.length || !viewerFreqs || viewerFreqs.length < 2) return;
                const fLow = viewerFreqs[0];
                const fHigh = viewerFreqs[viewerFreqs.length - 1];
                const fSpan = fHigh - fLow;
                if (fSpan <= 0) return;
                for (const det of viewerDetections) {
                    const yTop = det.row_start - firstVisibleRow;
                    const yBot = det.row_stop - firstVisibleRow;
                    if (yBot < 0 || yTop > viewH) continue;
                    let xLo = ((det.center_freq_hz - det.bandwidth_hz / 2) - fLow) / fSpan * 920;
                    let xHi = ((det.center_freq_hz + det.bandwidth_hz / 2) - fLow) / fSpan * 920;
                    xLo = Math.max(0, Math.min(920, xLo));
                    xHi = Math.max(0, Math.min(920, xHi));
                    const x = Math.min(xLo, xHi);
                    const w = Math.max(2, Math.abs(xHi - xLo));
                    const y = Math.max(0, yTop);
                    const h = Math.max(2, Math.min(viewH, yBot) - y);
                    const sel = (det === selectedDetection);
                    overlayCtx.strokeStyle = sel ? "rgba(255,120,120,1)" : "rgba(255,60,60,0.9)";
                    overlayCtx.lineWidth = sel ? 2 : 1.5;
                    overlayCtx.strokeRect(x, y, w, h);
                    overlayCtx.fillStyle = sel ? "rgba(255,60,60,0.18)" : "rgba(255,60,60,0.08)";
                    overlayCtx.fillRect(x, y, w, h);
                }
            }

            // Build the per-capture Detections table body from viewerDetections.
            function buildDetectionsTable() {
                if (!detTbody) return;
                if (!viewerDetections.length) {
                    const msg = viewerDetPending
                        ? "Detections pending (still processing)"
                        : "No detections in this capture";
                    detTbody.innerHTML = '<tr><td colspan="5" class="placeholder-text">' + msg + '</td></tr>';
                    return;
                }
                let h = '';
                for (let i = 0; i < viewerDetections.length; i++) {
                    const det = viewerDetections[i];
                    const t = (det.row_start * viewerTimeRes).toFixed(3) + "s";
                    const fHz = (det.peak_freq_hz != null) ? det.peak_freq_hz : det.center_freq_hz;
                    const f = (fHz / 1e6).toFixed(3) + " MHz";
                    const bw = (det.bandwidth_hz / 1e3).toFixed(1) + " kHz";
                    const dur = det.duration_ms.toFixed(2) + " ms";
                    const peak = det.peak_power_db.toFixed(1) + " dB";
                    h += '<tr data-det-idx="' + i + '"><td>' + t + '</td><td>' + f + '</td><td>'
                        + bw + '</td><td>' + dur + '</td><td>' + peak + '</td></tr>';
                }
                detTbody.innerHTML = h;
            }

            function drawViewerPSD(absRow) {
                const powers = getRow(absRow);
                if (!powers) return;
                drawPSD(psdCtx, 920, 160, powers, viewerFreqs, viewerMin, viewerMax, viewerCrosshairBin, null, viewerUnit);
            }

            function updateLabel() {
                const lastRow = Math.min(totalRows, firstVisibleRow + viewH);
                wfLabel.textContent = 'Waterfall (rows ' + firstVisibleRow + '–' + (lastRow - 1)
                    + ' of ' + totalRows + ', ' + totalDuration + 's total)';
            }

            // Re-scope the slider to the visible window, keeping the selected
            // absolute row when it stays on screen, else clamping to an edge.
            function rescopeSlider() {
                const lastVisible = Math.min(totalRows - 1, firstVisibleRow + viewH - 1);
                let v = parseInt(slider.value);
                slider.min = firstVisibleRow;
                slider.max = lastVisible;
                if (v < firstVisibleRow) v = firstVisibleRow;
                if (v > lastVisible) v = lastVisible;
                slider.value = v;
                timeLabel.textContent = (v * viewerTimeRes).toFixed(3) + "s";
            }

            let rafPending = false;
            async function onScroll() {
                firstVisibleRow = Math.max(0, Math.min(
                    totalRows - viewH, Math.round(scrollEl.scrollTop)));
                rescopeSlider();
                updateLabel();
                renderWaterfall();              // paint what's already cached
                drawViewerPSD(parseInt(slider.value));
                if (await ensureVisible(firstVisibleRow)) {
                    renderWaterfall();          // repaint once fetched pages land
                    drawViewerPSD(parseInt(slider.value));
                }

                // Preload further ahead in the scroll direction than the
                // visible span alone requires.
                const dir = Math.sign(firstVisibleRow - lastFirstVisibleRow);
                const lastVisibleRow = Math.min(totalRows - 1, firstVisibleRow + viewH - 1);
                const firstPage = pageIndexFor(firstVisibleRow);
                const lastPage = pageIndexFor(lastVisibleRow);
                if (dir >= 0) {
                    prefetchPages([lastPage + 1, lastPage + 2]);
                } else {
                    prefetchPages([firstPage - 1]);
                }
                lastFirstVisibleRow = firstVisibleRow;
            }

            scrollEl.addEventListener("scroll", function() {
                if (rafPending) return;
                rafPending = true;
                requestAnimationFrame(function() { rafPending = false; onScroll(); });
            });

            slider.addEventListener("input", function() {
                const idx = parseInt(this.value);
                timeLabel.textContent = (idx * viewerTimeRes).toFixed(3) + "s";
                renderWaterfall();
                drawViewerPSD(idx);
            });

            // Click a waterfall row → select it on the slider.
            wfCanvas.addEventListener("click", function(e) {
                const rect = wfCanvas.getBoundingClientRect();
                const scaleY = wfCanvas.height / rect.height;
                const absRow = firstVisibleRow + Math.floor((e.clientY - rect.top) * scaleY);
                if (absRow >= firstVisibleRow && absRow <= parseInt(slider.max)) {
                    slider.value = absRow;
                    slider.dispatchEvent(new Event("input"));
                }
            });

            // Click a detection row -> center it in the waterfall, select its
            // box, and sync the slider/PSD to its start row.
            if (detTbody) {
                detTbody.addEventListener("click", function(e) {
                    const tr = e.target.closest("tr[data-det-idx]");
                    if (!tr) return;
                    const det = viewerDetections[parseInt(tr.dataset.detIdx)];
                    if (!det) return;
                    selectedDetection = det;
                    detTbody.querySelectorAll("tr").forEach(function(r) {
                        r.classList.remove("is-selected");
                    });
                    tr.classList.add("is-selected");

                    scrollEl.scrollTop = Math.max(0, det.row_start - Math.floor(viewH / 2));
                    firstVisibleRow = Math.max(0, Math.min(
                        totalRows - viewH, Math.round(scrollEl.scrollTop)));
                    rescopeSlider();
                    updateLabel();
                    slider.value = Math.min(parseInt(slider.max),
                        Math.max(parseInt(slider.min), det.row_start));
                    slider.dispatchEvent(new Event("input"));   // repaints wf + PSD
                    ensureVisible(firstVisibleRow);
                    renderWaterfall();
                    drawDetectionOverlay();
                });
            }

            // PSD crosshair
            psdCanvas.addEventListener("mousemove", function(e) {
                const rect = psdCanvas.getBoundingClientRect();
                const scaleX = psdCanvas.width / rect.width;
                const x = (e.clientX - rect.left) * scaleX;
                const N = viewerFreqs.length;
                viewerCrosshairBin = Math.min(N - 1, Math.max(0, Math.floor((x / 920) * N)));

                const freq = viewerFreqs[viewerCrosshairBin] || 0;
                const idx = parseInt(slider.value);
                const rowData = getRow(idx);
                const power = rowData ? (rowData[viewerCrosshairBin] || 0) : 0;

                psdTooltip.style.display = "block";
                psdTooltip.textContent = (freq / 1e6).toFixed(2) + " MHz  " + power.toFixed(1) + " " + viewerUnit;
                const tipX = e.clientX - rect.left;
                psdTooltip.style.left = Math.min(tipX + 10, rect.width - 160) + "px";
                psdTooltip.style.top = "4px";

                drawViewerPSD(idx);
            });

            psdCanvas.addEventListener("mouseleave", function() {
                viewerCrosshairBin = -1;
                psdTooltip.style.display = "none";
                drawViewerPSD(parseInt(slider.value));
            });

            // Parse one binary PSD frame (12-byte LE header start,count,num_bins
            // then count*num_bins float32 row-major), fill the cache keyed by the
            // same page index the renderer reads, evict, and repaint if visible.
            function handlePsdBinary(buf) {
                const dv = new DataView(buf);
                const start = dv.getInt32(0, true);
                const count = dv.getInt32(4, true);
                const nb = dv.getInt32(8, true);
                const flat = new Float32Array(buf, 12, count * nb);
                const rows = new Array(count);
                for (let i = 0; i < count; i++) {
                    const off = i * nb;
                    const r = new Array(nb);
                    for (let j = 0; j < nb; j++) r[j] = flat[off + j];
                    rows[i] = r;
                }
                shiftRows(rows);
                const pageIdx = Math.round(start / PAGE);
                pageCache.set(pageIdx, rows);
                pageLoading.delete(pageIdx);
                evict(currentNeeded);
                const fp = pageIndexFor(firstVisibleRow);
                const lp = pageIndexFor(Math.min(totalRows - 1, firstVisibleRow + viewH - 1));
                if (pageIdx >= fp && pageIdx <= lp) {
                    renderWaterfall();
                    drawViewerPSD(parseInt(slider.value));
                }
            }

            // Open the binary PSD stream. Meta + the first page were bootstrapped
            // over HTTP above; the socket serves subsequent page fetches with
            // server push-ahead. If it never connects, ensureVisible falls back to
            // HTTP transparently. The meta frame is ignored (already bootstrapped).
            try {
                psdWs = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://")
                    + location.host + "/captures/ws/psd/" + encodeURIComponent(filename));
                psdWs.binaryType = "arraybuffer";
                psdWs.onmessage = function(ev) {
                    if (typeof ev.data === "string") return;
                    handlePsdBinary(ev.data);
                };
                psdWs.onerror = function() { try { psdWs.close(); } catch (_) {} };
                psdWs.onclose = function() { pageLoading.clear(); };
            } catch (_) { psdWs = null; }

            // Initial paint
            rescopeSlider();
            updateLabel();
            renderWaterfall();
            drawViewerPSD(0);

            // Load detections from the independent sidecar, then populate the
            // table + overlay. Guarded against a capture switch mid-flight.
            // Named (rather than the previous anonymous IIFE) so the Re-detect
            // button below can call it again after POSTing new thresholds,
            // reusing this same load + draw path instead of duplicating it.
            async function loadDetections() {
                try {
                    const r = await fetch("/captures/detections/" + encodeURIComponent(filename));
                    if (viewerFilename !== filename) return;   // superseded
                    if (r.ok) {
                        const dd = await r.json();
                        if (viewerFilename !== filename) return;
                        viewerDetections = dd.detections || [];
                        viewerDetPending = !!dd.pending;
                        if (redetectThresholdHigh && dd.params
                                && typeof dd.params.threshold_high_db === "number") {
                            redetectThresholdHigh.value = dd.params.threshold_high_db;
                        }
                    }
                } catch (_) {
                    viewerDetections = [];
                    viewerDetPending = false;
                }
                buildDetectionsTable();
                drawDetectionOverlay();
            }
            loadDetections();

            // Re-detect: POST the panel's thresholds against this capture's
            // stored PSD grid, then reload the sidecar via loadDetections()
            // (above) so the overlay + table refresh in place without
            // duplicating the drawing logic.
            if (redetectBtn) {
                redetectBtn.addEventListener("click", async function() {
                    if (viewerFilename !== filename) return;
                    redetectError.textContent = "";
                    redetectBtn.disabled = true;
                    const prevLabel = redetectBtn.textContent;
                    redetectBtn.textContent = "Re-detecting...";
                    try {
                        const body = {
                            threshold_high_db: parseFloat(redetectThresholdHigh.value),
                            threshold_low_ratio: parseFloat(redetectThresholdLow.value),
                            noise_floor_percentile: parseFloat(redetectNoiseFloor.value),
                            merge_time_ms: parseFloat(redetectMergeTime.value),
                        };
                        const r = await fetch("/captures/redetect/" + encodeURIComponent(filename), {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify(body),
                        });
                        if (!r.ok) {
                            let detail = "Re-detect failed";
                            try {
                                const err = await r.json();
                                if (err && err.detail) detail = err.detail;
                            } catch (_) {}
                            redetectError.textContent = detail;
                            return;
                        }
                        if (viewerFilename !== filename) return;   // superseded mid-flight
                        await loadDetections();
                    } catch (_) {
                        redetectError.textContent = "Re-detect failed";
                    } finally {
                        redetectBtn.disabled = false;
                        redetectBtn.textContent = prevLabel;
                    }
                });
            }

        } catch (_) {
            viewerEl.innerHTML = '<div class="placeholder-text">Failed to load PSD data</div>';
        }
    }

    function row(label, value) {
        return '<tr><td class="detail-label">' + label + '</td><td class="detail-value">' + value + '</td></tr>';
    }

    listEl.addEventListener("click", function(e) {
        const item = e.target.closest(".capture-item");
        if (item) showDetail(item.dataset.file, item.dataset.hasPsd === "1");
    });

    // --- Replay this capture (managed capture, resolved server-side from its .json) ---
    detailEl.addEventListener("click", async function(e) {
        const btn = e.target.closest("#replay-capture-btn");
        if (!btn) return;
        const errEl = document.getElementById("replay-capture-error");
        if (errEl) errEl.textContent = "";
        btn.disabled = true;
        try {
            const r = await fetch("/api/replay/start", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({filename: btn.dataset.filename}),
            });
            if (r.ok) {
                location.href = "/";
                return;
            }
            const err = await r.json().catch(function() { return {}; });
            if (errEl) errEl.textContent = err.detail || "Failed to start replay";
        } catch (err) {
            if (errEl) errEl.textContent = "Network error: " + err.message;
        }
        btn.disabled = false;
    });

    // --- Replay a raw file (arbitrary path outside the managed capture store) ---
    (function() {
        const pathInput = document.getElementById("replay-path");
        const centerInput = document.getElementById("replay-center-mhz");
        const rateInput = document.getElementById("replay-rate-msps");
        const gainInput = document.getElementById("replay-gain-db");
        const datatypeSelect = document.getElementById("replay-datatype");
        const speedSelect = document.getElementById("replay-speed");
        const startBtn = document.getElementById("replay-raw-start-btn");
        const errEl = document.getElementById("replay-raw-error");

        // Mirrors rfobserver.capture.sigmf_reader.parse_capture_filename's
        // regexes so a raw filename prefills the same fields the managed
        // capture flow derives server-side. Fields with no match are left
        // untouched (editable, not overwritten with blanks).
        function extractParams(pathStr) {
            const name = pathStr.split("/").pop() || pathStr;
            const out = {};
            let m;
            if ((m = name.match(/_(\d+(?:\.\d+)?)MHz/))) out.center_mhz = parseFloat(m[1]);
            if ((m = name.match(/_(\d+(?:\.\d+)?)Msps/))) out.rate_msps = parseFloat(m[1]);
            if ((m = name.match(/_(\d+(?:\.\d+)?)dB/))) out.gain_db = parseFloat(m[1]);
            return out;
        }

        pathInput.addEventListener("change", function() {
            const params = extractParams(pathInput.value);
            if (params.center_mhz != null) centerInput.value = params.center_mhz;
            if (params.rate_msps != null) rateInput.value = params.rate_msps;
            if (params.gain_db != null) gainInput.value = params.gain_db;
        });

        startBtn.addEventListener("click", async function() {
            const path = pathInput.value.trim();
            errEl.textContent = "";
            if (!path) { errEl.textContent = "Path is required"; return; }
            const rateMsps = parseFloat(rateInput.value);
            if (isNaN(rateMsps) || rateMsps <= 0) {
                errEl.textContent = "Sample rate is required";
                return;
            }
            const centerMhz = parseFloat(centerInput.value);
            const gainDb = parseFloat(gainInput.value);

            startBtn.disabled = true;
            const body = {
                path: path,
                sample_rate_hz: rateMsps * 1e6,
                center_freq_hz: isNaN(centerMhz) ? 0 : centerMhz * 1e6,
                gain_db: isNaN(gainDb) ? 0 : gainDb,
                datatype: datatypeSelect.value,
                speed: parseFloat(speedSelect.value),
            };
            try {
                const r = await fetch("/api/replay/start", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(body),
                });
                if (r.ok) {
                    location.href = "/";
                    return;
                }
                const err = await r.json().catch(function() { return {}; });
                errEl.textContent = err.detail || "Failed to start replay";
            } catch (err) {
                errEl.textContent = "Network error: " + err.message;
            }
            startBtn.disabled = false;
        });
    })();

    loadList();

    // Re-list when capture_count ticks up on the /ws/live heartbeat — that's
    // the signal a recording finished and dropped a new file in storage.
    (function() {
        let lastCount = -1;
        let ws = null;
        function connect() {
            ws = new WebSocket("ws://" + location.host + "/ws/live");
            ws.onmessage = function(evt) {
                try {
                    const d = JSON.parse(evt.data);
                    if (d.type !== "heartbeat") return;
                    if (typeof d.capture_count === "number" && d.capture_count !== lastCount) {
                        if (lastCount >= 0) loadList();
                        lastCount = d.capture_count;
                    }
                } catch (_) {}
            };
            ws.onclose = function() { ws = null; setTimeout(connect, 2000); };
            ws.onerror = function() { try { ws.close(); } catch (_) {} };
        }
        connect();
    })();
})();
</script>
{% endblock %}
