<!DOCTYPE html>
<html lang="en" data-theme="{{ ui_theme or 'auto' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RFObs{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Served locally: sensors can be reached with no internet connection.
         htmx 2.0.4, byte-identical to the npm package's dist/htmx.min.js. -->
    <script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
    <script src="/static/theme.js" defer></script>
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-title">RFObs</div>
        <div class="nav-links">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/live/" class="nav-link">Live</a>
            <a href="/captures/" class="nav-link">Captures</a>
            <a href="/config/" class="nav-link">Config</a>
            <a href="/detections" class="nav-link">Detections</a>
        </div>
        {% set theme = ui_theme or 'auto' %}
        <select id="theme-select" class="theme-select" title="Color theme" aria-label="Color theme">
            <option value="auto"{% if theme == 'auto' %} selected{% endif %}>Auto</option>
            <option value="light"{% if theme == 'light' %} selected{% endif %}>Light</option>
            <option value="dark"{% if theme == 'dark' %} selected{% endif %}>Dark</option>
        </select>
    </nav>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <span>This work is supported by NSF Cooperative Agreement #2431961.</span>
        <span>&copy; 2026 University of Colorado Boulder &mdash; WIRG.</span>
    </footer>
</body>
</html>
